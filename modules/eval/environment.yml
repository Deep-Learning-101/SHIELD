# 使用方式:
#   方式 1 - 直接從此檔案建立環境:
#     conda env create -f environment.yml
#
#   方式 2 - 建立環境後啟用:
#     conda activate shield-audit-env
#
#   方式 3 - 更新現有環境:
#     conda env update -f environment.yml --prune
# ═══════════════════════════════════════════════════════════════════════

name: shield-audit-env

channels:
  - conda-forge
  - defaults

dependencies:
  # ─────────────────────────────────────────────────────────────────────
  # 核心 Python 環境
  # ─────────────────────────────────────────────────────────────────────
  - python=3.10
  - pip>=23.0

  # ─────────────────────────────────────────────────────────────────────
  # 科學計算與資料處理基礎套件（優先使用 conda 安裝以優化相依性）
  # ─────────────────────────────────────────────────────────────────────
  - numpy>=1.24.0
  - pandas>=2.0.0
  - pyyaml>=6.0

  # ─────────────────────────────────────────────────────────────────────
  # 機器學習框架（建議使用 conda 安裝以獲得優化版本）
  # ─────────────────────────────────────────────────────────────────────
  - pytorch>=2.0.0
  - torchvision
  - torchaudio

  # ─────────────────────────────────────────────────────────────────────
  # 可解釋性與視覺化套件
  # ─────────────────────────────────────────────────────────────────────
  - matplotlib>=3.7.0
  - scikit-learn>=1.3.0

  # ─────────────────────────────────────────────────────────────────────
  # 透過 pip 安裝的專案特定套件
  # ─────────────────────────────────────────────────────────────────────
  - pip:
      # 核心排程器與框架
      - inspect-ai>=0.3.0

      # 攻擊端武器庫 - GenAI Text
      - garak>=0.9.0

      # 攻擊端武器庫 - CV/Audio 對抗樣本生成
      - adversarial-robustness-toolbox>=1.16.0
      - foolbox>=3.3.0

      # 裁判端評估器 - GenAI Text
      - trulens-eval>=0.22.0
      - giskard>=2.0.0

      # 裁判端評估器 - CV/Audio 可解釋性
      - shap>=0.44.0
      - captum>=0.7.0

      # 基礎設施與配置管理
      - python-dotenv>=1.0.0

      # HTTP 請求與 API 互動
      - requests>=2.31.0
      - httpx>=0.24.0

# ═══════════════════════════════════════════════════════════════════════
# 環境變數（選用）
# ═══════════════════════════════════════════════════════════════════════
# variables:
#   SHIELD_TARGET_API_KEY: "your_api_key_here"
#   PYTORCH_CUDA_ALLOC_CONF: "max_split_size_mb:512"
